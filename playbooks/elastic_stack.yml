---
# playbooks/elastic_stack.yml
# Installs and configures Elasticsearch, Kibana, and Logstash,
# each on their own separate host per the exam requirement.

- name: Install and configure Elasticsearch
  hosts: elasticsearch
  become: true
  vars_files:
    - ../config.yaml
  roles:
    - elasticsearch

- name: Install and configure Kibana
  hosts: kibana
  become: true
  vars_files:
    - ../config.yaml
  roles:
    - kibana

- name: Install and configure Logstash
  hosts: logstash
  become: true
  vars_files:
    - ../config.yaml
  roles:
    - logstash
