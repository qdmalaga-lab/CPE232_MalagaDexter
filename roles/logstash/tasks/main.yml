---
# roles/logstash/tasks/main.yml
- name: Disable unattended-upgrades to avoid apt lock conflicts
  ansible.builtin.systemd:
    name: unattended-upgrades
    enabled: false
    state: stopped
  ignore_errors: true

- name: Install prerequisite packages (Java + tools)
  apt:
    name:
      - apt-transport-https
      - gnupg2
      - curl
      - openjdk-17-jre-headless
    state: present
    update_cache: true

- name: Ensure /etc/apt/keyrings exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download and store the Elastic GPG key
  shell: curl -fsSL https://artifacts.elastic.co/GPG-KEY-elasticsearch | gpg --dearmor -o /etc/apt/keyrings/elastic.gpg
  args:
    creates: /etc/apt/keyrings/elastic.gpg

- name: Add Elastic APT repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/elastic.gpg] https://artifacts.elastic.co/packages/8.x/apt stable main"
    state: present
    filename: elastic-8.x

- name: Install Logstash
  apt:
    name: logstash
    state: present
    update_cache: true

- name: Deploy a basic Logstash pipeline (syslog -> Elasticsearch)
  copy:
    dest: /etc/logstash/conf.d/syslog.conf
    content: |
      input {
        beats {
          port => {{ logstash_port }}
        }
      }
      output {
        elasticsearch {
          hosts => ["http://{{ hostvars['es-host']['ansible_host'] }}:{{ elasticsearch_port }}"]
          index => "syslog-%{+YYYY.MM.dd}"
        }
      }

- name: Enable and start Logstash service
  systemd:
    name: logstash
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for Logstash beats input port to open
  wait_for:
    port: "{{ logstash_port }}"
    timeout: 180
