---
# roles/apache_php/tasks/main.yml
- name: Install Apache
  apt:
    name: apache2
    state: present
    update_cache: true

- name: Install PHP and required extensions
  apt:
    name: "{{ php_packages }}"
    state: present

- name: Deploy a phpinfo test page
  copy:
    dest: /var/www/html/info.php
    content: "<?php phpinfo(); ?>\n"

- name: Enable and restart Apache
  systemd:
    name: apache2
    enabled: true
    state: restarted

- name: Wait for Apache to respond on port 80
  wait_for:
    port: 80
    timeout: 60

- name: Verify the PHP test page is served correctly
  uri:
    url: "http://localhost/info.php"
    return_content: true
  register: php_check

- name: Confirm PHP is working
  assert:
    that: "'PHP Version' in php_check.content"
    fail_msg: "PHP does not appear to be processing requests correctly."
    success_msg: "Apache + PHP installed and verified successfully."
