---
# roles/grafana/tasks/main.yml
- name: Disable unattended-upgrades to avoid apt lock conflicts
  ansible.builtin.systemd:
    name: unattended-upgrades
    enabled: false
    state: stopped
  ignore_errors: true

- name: Install prerequisite packages
  apt:
    name:
      - apt-transport-https
      - software-properties-common
      - wget
      - gnupg2
    state: present
    update_cache: true

- name: Ensure /etc/apt/keyrings exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download and store the Grafana GPG key
  shell: curl -fsSL https://apt.grafana.com/gpg.key | gpg --dearmor -o /etc/apt/keyrings/grafana.gpg
  args:
    creates: /etc/apt/keyrings/grafana.gpg

- name: Add Grafana APT repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/grafana.gpg] https://apt.grafana.com stable main"
    state: present
    filename: grafana

- name: Install Grafana
  apt:
    name: "grafana={{ grafana_version }}"
    state: present
    update_cache: true

- name: Set Grafana HTTP port
  lineinfile:
    path: /etc/grafana/grafana.ini
    regexp: '^;?http_port ='
    line: "http_port = {{ grafana_port }}"

- name: Set Grafana admin credentials
  lineinfile:
    path: /etc/grafana/grafana.ini
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - { regexp: '^;?admin_user =', line: "admin_user = {{ grafana_admin_user }}" }
    - { regexp: '^;?admin_password =', line: "admin_password = {{ grafana_admin_password }}" }

- name: Enable and start Grafana service
  systemd:
    name: grafana-server
    enabled: true
    state: started
    daemon_reload: true

- name: Reset Grafana admin password (idempotent)
  ansible.builtin.command: grafana-cli admin reset-admin-password "{{ grafana_admin_password }}"
  changed_when: true

- name: Wait for Grafana to respond
  wait_for:
    port: "{{ grafana_port }}"
    timeout: 60

- name: Add Prometheus as a Grafana data source
  uri:
    url: "http://localhost:{{ grafana_port }}/api/datasources"
    url_username: "{{ grafana_admin_user }}"
    url_password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    method: POST
    body_format: json
    status_code: [200, 409]
    body:
      name: "Prometheus"
      type: "prometheus"
      url: "http://{{ hostvars['prometheus-host']['ansible_host'] }}:{{ prometheus_port }}"
      access: "proxy"
      isDefault: true
