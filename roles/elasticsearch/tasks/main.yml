---
# roles/elasticsearch/tasks/main.yml
- name: Install prerequisite packages
  apt:
    name:
      - apt-transport-https
      - gnupg2
      - curl
    state: present
    update_cache: true

- name: Remove orphaned SSL keystore secrets from security auto-config
  ansible.builtin.command: /usr/share/elasticsearch/bin/elasticsearch-keystore remove "{{ item }}"
  loop:
    - xpack.security.transport.ssl.keystore.secure_password
    - xpack.security.transport.ssl.truststore.secure_password
    - xpack.security.http.ssl.keystore.secure_password
  register: keystore_remove
  failed_when: keystore_remove.rc not in [0, 78]  # 78 = "not found", safe to ignore
  changed_when: keystore_remove.rc == 0

- name: Remove Elastic security auto-configuration block from elasticsearch.yml
  ansible.builtin.blockinfile:
    path: /etc/elasticsearch/elasticsearch.yml
    marker: "#{mark} SECURITY AUTO CONFIGURATION"
    state: absent

- name: Disable X-Pack security (lab/demo setup)
  ansible.builtin.lineinfile:
    path: /etc/elasticsearch/elasticsearch.yml
    regexp: '^xpack\.security\.enabled:'
    line: "xpack.security.enabled: false"
    state: present

- name: Ensure /etc/apt/keyrings exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download and store the Elastic GPG key
  shell: curl -fsSL https://artifacts.elastic.co/GPG-KEY-elasticsearch | gpg --dearmor -o /etc/apt/keyrings/elastic.gpg
  args:
    creates: /etc/apt/keyrings/elastic.gpg

- name: Disable X-Pack security (lab/demo setup)
  ansible.builtin.lineinfile:
    path: /etc/elasticsearch/elasticsearch.yml
    line: "xpack.security.enabled: false"
    state: present
  notify: restart elasticsearch

- name: Add Elastic APT repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/elastic.gpg] https://artifacts.elastic.co/packages/8.x/apt stable main"
    state: present
    filename: elastic-8.x

- name: Ensure /etc/apt/keyrings exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download and store the Elastic GPG key
  shell: curl -fsSL https://artifacts.elastic.co/GPG-KEY-elasticsearch | gpg --dearmor -o /etc/apt/keyrings/elastic.gpg
  args:
    creates: /etc/apt/keyrings/elastic.gpg

- name: Add Elastic APT repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/elastic.gpg] https://artifacts.elastic.co/packages/8.x/apt stable main"
    state: present
    filename: elastic-8.x

- name: Install Elasticsearch
  apt:
    name: elasticsearch
    state: present
    update_cache: true

- name: Configure Elasticsearch to listen on all interfaces
  lineinfile:
    path: /etc/elasticsearch/elasticsearch.yml
    regexp: '^network.host:'
    line: "network.host: 0.0.0.0"
    create: true

- name: Set discovery type to single-node (lab/demo setup)
  lineinfile:
    path: /etc/elasticsearch/elasticsearch.yml
    regexp: '^discovery.type:'
    line: "discovery.type: single-node"

- name: Set JVM heap size
  lineinfile:
    path: /etc/elasticsearch/jvm.options.d/heap.options
    line: "-Xms{{ elasticsearch_heap_size }}\n-Xmx{{ elasticsearch_heap_size }}"
    create: true

- name: Enable and start Elasticsearch service
  systemd:
    name: elasticsearch
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for Elasticsearch to respond on its port
  wait_for:
    port: "{{ elasticsearch_port }}"
    timeout: 120

- name: Verify Elasticsearch cluster health
  uri:
    url: "http://localhost:{{ elasticsearch_port }}/_cluster/health"
    return_content: true
  register: es_health

- name: Show Elasticsearch health output
  debug:
    var: es_health.content
