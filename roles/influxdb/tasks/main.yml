---
# roles/influxdb/tasks/main.yml
- name: Disable unattended-upgrades to avoid apt lock conflicts
  ansible.builtin.systemd:
    name: unattended-upgrades
    enabled: false
    state: stopped
  ignore_errors: true

- name: Install prerequisite packages
  apt:
    name:
      - apt-transport-https
      - curl
      - gnupg2
    state: present
    update_cache: true

- name: Ensure /etc/apt/keyrings exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Import InfluxData GPG key from Ubuntu keyserver
  ansible.builtin.command: >
    gpg --no-default-keyring --keyring /etc/apt/keyrings/influxdata-import.gpg
    --keyserver keyserver.ubuntu.com --recv-keys DA61C26A0585BD3B
  args:
    creates: /etc/apt/keyrings/influxdata-import.gpg

- name: Export InfluxData key to classic OpenPGP format for apt
  ansible.builtin.command: >
    gpg --no-default-keyring --keyring /etc/apt/keyrings/influxdata-import.gpg
    --export -o /etc/apt/keyrings/influxdata.gpg
  args:
    creates: /etc/apt/keyrings/influxdata.gpg

- name: Add InfluxData APT repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/influxdata.gpg] https://repos.influxdata.com/debian stable main"
    state: present
    filename: influxdata

- name: Install InfluxDB
  apt:
    name: influxdb2
    state: present
    update_cache: true

- name: Enable and start InfluxDB service
  systemd:
    name: influxdb
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for InfluxDB API to respond
  wait_for:
    port: "{{ influxdb_port }}"
    timeout: 60

- name: Run initial InfluxDB setup (org, bucket, admin user)
  command: >
    influx setup
    --username {{ influxdb_admin_user }}
    --password {{ influxdb_admin_password }}
    --org {{ influxdb_org }}
    --bucket {{ influxdb_bucket }}
    --force
  register: influx_setup_result
  changed_when: "'Success' in influx_setup_result.stdout"
  failed_when: false
