---
# roles/nagios/tasks/main.yml
- name: Disable unattended-upgrades to avoid apt lock conflicts
  ansible.builtin.systemd:
    name: unattended-upgrades
    enabled: false
    state: stopped
  ignore_errors: true

- name: Install build prerequisites and Apache/PHP for the Nagios web UI
  apt:
    name:
      - autoconf
      - gcc
      - libc6
      - make
      - wget
      - unzip
      - apache2
      - php
      - libapache2-mod-php
      - libgd-dev
      - openssl
      - libssl-dev
      - daemon
    state: present
    update_cache: true

- name: Create nagios and nagcmd system group/user
  user:
    name: nagios
    shell: /sbin/nologin
    system: true

- name: Create nagcmd group
  group:
    name: nagcmd
    system: true

- name: Add nagios and www-data to nagcmd group
  user:
    name: "{{ item }}"
    groups: nagcmd
    append: true
  loop:
    - nagios
    - www-data

- name: Download Nagios Core source
  get_url:
    url: "https://assets.nagios.com/downloads/nagioscore/releases/nagios-4.5.7.tar.gz"
    dest: /tmp/nagios.tar.gz

- name: Extract Nagios Core source
  unarchive:
    src: /tmp/nagios.tar.gz
    dest: /tmp
    remote_src: true

- name: Configure Nagios Core
  command: ./configure --with-nagios-group=nagios --with-command-group=nagcmd
  args:
    chdir: /tmp/nagios-4.5.7

- name: Compile Nagios Core
  command: make all
  args:
    chdir: /tmp/nagios-4.5.7

- name: Remove existing Nagios Apache conf symlink (idempotency fix)
  ansible.builtin.file:
    path: /etc/apache2/sites-enabled/nagios.conf
    state: absent

- name: Install Nagios Core (binaries, init scripts, config, commandmode)
  shell: |
    make install
    make install-init
    make install-commandmode
    make install-config
    make install-webconf
  args:
    chdir: /tmp/nagios-4.5.7

- name: Set Nagios admin password for web UI
  community.general.htpasswd:
    path: /usr/local/nagios/etc/htpasswd.users
    name: "{{ nagios_admin_user }}"
    password: "{{ nagios_admin_password }}"
    owner: root
    group: www-data
    mode: "0640"

- name: Enable required Apache modules
  apache2_module:
    name: "{{ item }}"
    state: present
  loop:
    - rewrite
    - cgi

- name: Enable and restart Apache
  systemd:
    name: apache2
    enabled: true
    state: restarted

- name: Enable and start Nagios service
  systemd:
    name: nagios
    enabled: true
    state: started

- name: Wait for the Nagios web UI to respond
  wait_for:
    port: "{{ nagios_http_port }}"
    timeout: 60
