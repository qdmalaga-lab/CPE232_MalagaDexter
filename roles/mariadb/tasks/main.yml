---
# roles/mariadb/tasks/main.yml
- name: Install MariaDB server and Python bindings for Ansible's mysql modules
  apt:
    name:
      - mariadb-server
      - python3-pymysql
    state: present
    update_cache: true

- name: Enable and start MariaDB
  systemd:
    name: mariadb
    enabled: true
    state: started

- name: Attempt to set MariaDB root password via unix socket (first run only)
  community.mysql.mysql_user:
    name: root
    password: "{{ mariadb_root_password }}"
    login_unix_socket: /run/mysqld/mysqld.sock
    check_implicit_admin: true
    host_all: true
  register: root_pw_socket
  ignore_errors: true

- name: Set MariaDB root password via existing credentials (subsequent runs)
  community.mysql.mysql_user:
    name: root
    password: "{{ mariadb_root_password }}"
    login_user: root
    login_password: "{{ mariadb_root_password }}"
    host_all: true
  when: root_pw_socket is failed

- name: Remove anonymous MariaDB users
  community.mysql.mysql_user:
    name: ""
    host_all: true
    state: absent
    login_user: root
    login_password: "{{ mariadb_root_password }}"

- name: Remove the test database
  community.mysql.mysql_db:
    name: test
    state: absent
    login_user: root
    login_password: "{{ mariadb_root_password }}"

- name: Create the application database
  community.mysql.mysql_db:
    name: "{{ mariadb_app_db }}"
    state: present
    login_user: root
    login_password: "{{ mariadb_root_password }}"

- name: Create the application database user
  community.mysql.mysql_user:
    name: "{{ mariadb_app_user }}"
    password: "{{ mariadb_app_password }}"
    priv: "{{ mariadb_app_db }}.*:ALL"
    host: "%"
    state: present
    login_user: root
    login_password: "{{ mariadb_root_password }}"

- name: Allow MariaDB to listen on all interfaces (for the web host to connect)
  lineinfile:
    path: /etc/mysql/mariadb.conf.d/50-server.cnf
    regexp: "^bind-address"
    line: "bind-address = 0.0.0.0"

- name: Restart MariaDB to apply bind-address change
  systemd:
    name: mariadb
    state: restarted
